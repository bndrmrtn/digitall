services:
  app:
    build: app
    container_name: digitall-app
    working_dir: /var/www/html
    volumes:
      - public_data:/var/www/html/public:rw,z
      - ./docker/data/app:/var/www/html/storage/app
    depends_on:
      - db
    networks:
      - laravel

  nginx:
    image: nginx:1.27-alpine
    container_name: digitall-nginx
    ports:
      - '8000:80'
    volumes:
      - public_data:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.4
    container_name: digitall-mysql
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - ./docker/data/db:/var/lib/mysql
    networks:
      - laravel

  adminer:
    image: adminer:latest
    container_name: digitall-adminer
    ports:
      - '8081:8080'
    environment:
      # Adminer can use this as a default server suggestion in some setups
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - laravel

volumes:
  public_data:

networks:
  laravel:
    driver: bridge
