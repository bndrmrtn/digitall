services:
  app:
    build: .
    container_name: digitall-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:z
    env_file: .env
    depends_on:
      - db
    networks:
      - laravel
    user: 1000:1000

  nginx:
    image: nginx:1.27-alpine
    container_name: digitall-nginx
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.4
    container_name: digitall-mysql
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  adminer:
    image: adminer:latest
    container_name: digitall-adminer
    ports:
      - '8081:8080'
    environment:
      # Adminer can use this as a default server suggestion in some setups
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
