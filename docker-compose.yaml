services:
  app:
    build: app
    container_name: digitall-app
    working_dir: /var/www/html
    volumes:
      - app_data:/var/www/html:rw,z
      - ./docker/data/app:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - digitall

  nginx:
    image: nginx:1.27-alpine
    container_name: digitall-nginx
    ports:
      - '8000:80'
    volumes:
      - app_data:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - digitall

  db:
    image: mysql:8.4
    container_name: digitall-mysql
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -prootsecret || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/data/db:/var/lib/mysql
    networks:
      - digitall

  adminer:
    image: adminer:latest
    container_name: digitall-adminer
    ports:
      - '8081:8080'
    environment:
      # Adminer can use this as a default server suggestion in some setups
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - digitall

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: digitall-grafana
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/containers-overview.json
    volumes:
      - ./docker/data/grafana:/var/lib/grafana
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "8003:3000"
    networks:
      - digitall

  # Prometheus (metrics storage + scraping)
  prometheus:
    image: prom/prometheus:latest
    container_name: digitall-prometheus
    restart: unless-stopped
    ports:
      - "8004:9090"
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - cadvisor
    networks:
      - digitall

  # cAdvisor (container-level resource metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: digitall-cadvisor
    restart: unless-stopped
    ports:
      - "8005:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true
    networks:
      - digitall

volumes:
  app_data:

networks:
  digitall:
    driver: bridge
